<style>
/* Layout: mobile-first single column, sticky header, bottom tab bar; deck pages use a segmented control (Fiche / Flashcards / QCM / Modifier) */
:root{
  --bg:#fbefea; --surface:#ffffff; --ink:#1f1a22; --muted:#6b5f66; --line:#ecd8d1;
  --grad:linear-gradient(165deg,#fde6dd 0%,#f9e7f1 45%,#e8e8fb 100%); --bar:rgba(252,236,231,.86);
  --scrub:#1d6a58; --scrub-ink:#ffffff; --scrub-soft:#dbece5;
  --late:#b9502f; --late-soft:#f7e3dc; --ok:#2b7a4b; --ok-soft:#dff1e6; --hl:#fff1a8; --hl-ink:#15221e;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17121b; --surface:#211b27; --ink:#efe8ee; --muted:#a99ca7; --line:#3a3040;
  --grad:linear-gradient(165deg,#22141f 0%,#181528 50%,#0f1b22 100%); --bar:rgba(26,19,30,.86);
  --scrub:#5cbfa2; --scrub-ink:#0b1311; --scrub-soft:#1b332b;
  --late:#e88b6c; --late-soft:#3a221b; --ok:#6ec88f; --ok-soft:#183324; --hl:#5b5320; --hl-ink:#f5f0d0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17121b; --surface:#211b27; --ink:#efe8ee; --muted:#a99ca7; --line:#3a3040;
  --grad:linear-gradient(165deg,#22141f 0%,#181528 50%,#0f1b22 100%); --bar:rgba(26,19,30,.86);
  --scrub:#5cbfa2; --scrub-ink:#0b1311; --scrub-soft:#1b332b;
  --late:#e88b6c; --late-soft:#3a221b; --ok:#6ec88f; --ok-soft:#183324; --hl:#5b5320; --hl-ink:#f5f0d0; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--bg);background-image:var(--grad);background-attachment:fixed;min-height:100vh;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
.label{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--scrub);outline-offset:2px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px;padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.topbar .grow{flex:1;min-width:0}
.topbar .t{font-family:var(--f-display);font-weight:800;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.btn{border:0;border-radius:999px;padding:11px 18px;background:var(--scrub);color:var(--scrub-ink);font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

.btn.small{padding:7px 13px;font-size:.88rem}

.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.section{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.hero{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted)}
.deck{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.deck .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.deck .top>div{min-width:0}
.pill{font-family:var(--f-mono);font-size:.7rem;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--scrub-soft);color:var(--ink)}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.jstrip{display:flex;gap:6px;flex-wrap:wrap}
.j{font-family:var(--f-mono);font-size:.74rem;padding:4px 8px;border-radius:8px;border:1px dashed var(--line);color:var(--muted)}
.j.done{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.j.due{border-style:solid;border-color:var(--scrub);color:var(--scrub-ink);background:var(--scrub)}
.j.late{border-style:solid;border-color:var(--late);color:var(--scrub-ink);background:var(--late)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:18px}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 4px;font-size:.88rem;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--scrub);color:var(--scrub-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.fiche{min-width:0;overflow-wrap:anywhere}
.fiche h2{margin:18px 0 6px}.fiche h3{margin:14px 0 4px;color:var(--scrub)}
.fiche h2:first-child,.fiche h3:first-child{margin-top:0}
.fiche p{margin:6px 0}.fiche ul{margin:6px 0;padding-left:20px}
.fiche mark{background:var(--hl);color:var(--hl-ink);padding:0 3px;border-radius:3px}
.card-wrap{perspective:1200px}
.fcard{position:relative;min-height:240px;border-radius:18px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fcard.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;justify-content:center;border:1px solid var(--line);background:var(--surface);overflow:auto;overflow-wrap:anywhere}
.face.back{transform:rotateY(180deg);background:var(--scrub-soft)}
.face .q{font-family:var(--f-display);font-weight:600;font-size:1.25rem;line-height:1.3}
.progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--scrub);transition:width .3s}
.answer-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;width:100%}
.opt .k{font-family:var(--f-mono);font-weight:500;flex:none;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem}
.opt[aria-pressed="true"]{border-color:var(--scrub)}
.opt[aria-pressed="true"] .k{background:var(--scrub);color:var(--scrub-ink);border-color:var(--scrub)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--late);background:var(--late-soft)}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.expl{border-left:3px solid var(--scrub);padding:8px 12px;background:var(--scrub-soft);border-radius:0 10px 10px 0}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:.9rem}
input[type=text],input[type=date],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:400}
textarea{resize:vertical;min-height:90px;line-height:1.45}
.edit-item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.optedit{display:flex;gap:8px;align-items:center}
.optedit input[type=text]{flex:1;min-width:0}
.optedit input[type=checkbox]{width:22px;height:22px;accent-color:var(--scrub);flex:none}
.partie{margin-top:6px;color:var(--scrub)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar button{flex:1;max-width:200px;border:0;background:transparent;border-radius:12px;padding:8px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem}
.tabbar button[aria-current="page"]{color:var(--scrub);background:var(--scrub-soft)}
.tabbar svg{width:22px;height:22px}
.sheet{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.45);display:grid;place-items:end center;padding:16px}
.sheet .box{background:var(--surface);border-radius:18px;padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;margin-bottom:env(safe-area-inset-bottom,0px)}
.timer{font-family:var(--f-display);font-weight:800;font-size:4.2rem;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;z-index:10}
.help{font-size:.85rem;color:var(--muted)}
code{font-family:var(--f-mono);font-size:.85em;background:var(--scrub-soft);padding:1px 5px;border-radius:5px}
.seg{display:flex;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;white-space:nowrap;padding:8px 12px}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px;margin-bottom:12px}
.searchbar svg{width:20px;height:20px;color:var(--muted);flex:none}
.searchbar input{flex:1;min-width:0;border:0;background:transparent;padding:9px 0;font-size:1rem;outline:none}
.searchbar:focus-within{border-color:var(--scrub);box-shadow:0 0 0 2px var(--scrub-soft)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:700;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--scrub);border-color:var(--scrub);color:var(--scrub-ink)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.filters select{padding:8px 10px;font-size:.9rem}
.res{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%}
.res .t{font-weight:700;overflow-wrap:anywhere}
.res .s{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.res mark,.srcchunk mark{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 2px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mtile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.mini{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;width:100%}
.mini span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fiche h4{font-family:var(--f-display);font-size:.98rem;margin:12px 0 4px}
.fiche h5{font-family:var(--f-display);font-size:.92rem;margin:10px 0 4px;color:var(--muted)}
.tblwrap{overflow-x:auto;margin:8px 0}
.fiche table{border-collapse:collapse;width:100%;font-size:.9rem}
.fiche th,.fiche td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.fiche th{background:var(--scrub-soft)}
.callout{border-left:3px solid var(--late);background:var(--late-soft);padding:8px 12px;border-radius:0 10px 10px 0;margin:8px 0}
.fiche figure{margin:12px 0}
.fiche figure img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff;display:block}
.fiche figcaption{font-size:.85rem;color:var(--muted);margin-top:4px}
.srcchunk{padding:10px 0;border-bottom:1px dashed var(--line);white-space:pre-wrap;font-size:.93rem;overflow-wrap:anywhere}
.srcchunk h3{white-space:normal;margin-bottom:4px;color:var(--scrub)}
.flash{animation:flash 2s ease-out}
@keyframes flash{0%,40%{background:var(--hl)}100%{background:transparent}}
details.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}

.cov{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:10px 12px;background:var(--surface)}
.cov.ok{border-left-color:var(--ok)}.cov.part{border-left-color:#c99a1c}.cov.nt{border-left-color:var(--late)}.cov.nv{border-left-color:var(--line)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.72rem;padding:2px 7px;border-radius:6px;margin:2px 4px 2px 0;background:var(--late-soft);color:var(--late)}
.tag.okt{background:var(--ok-soft);color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.85rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
@media (max-width:420px){h1{font-size:1.6rem}.seg button{font-size:.8rem}.filters{grid-template-columns:1fr}}
.cimg{display:block;max-width:100%;max-height:200px;object-fit:contain;margin:0 auto 6px;border-radius:8px;background:#fff}
.zoomable{cursor:zoom-in}

.tl{display:flex;flex-direction:column;gap:8px}

.k-cours{border-left-color:#5b7fd6}.k-hab{border-left-color:#9a8bb8}.k-obl{border-left-color:#c99a1c}.k-imp{border-left-color:var(--late);background:var(--late-soft)}

.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

.wday.today{border-color:var(--scrub);box-shadow:0 0 0 2px var(--scrub-soft)}
.wl{font-size:.8rem;border-left:3px solid var(--line);padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:110px}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}

.bar span{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.mrow{display:grid;grid-template-columns:minmax(0,1.4fr) 1fr 42px;gap:10px;align-items:center;font-size:.88rem}
.mrow>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}

.flow{margin:10px 0}.flow svg{width:100%;height:auto;display:block;max-width:560px;margin:0 auto}

.mnemo{margin-top:8px}
.face .mnemo .btn{align-self:flex-start}

function liveSync(){
  try{
    db.collection("decks").limit(1000).onSnapshot(snap=>{
      const server=new Map(snap.docs.filter(x=>x.exists).map(x=>[x.id,x]));
      let changed=false;
      S.decks=S.decks.filter(d=>{if(server.has(d.id)||S.dirty.has(d.id))return true;changed=true;return false});
      for(const [id,doc] of server){
        if(S.dirty.has(id)||S.saving)continue;
        const i=S.decks.findIndex(d=>d.id===id);
        const fresh={...clone(doc.data()),id};
        if(i<0){S.decks.push(fresh);changed=true}
        else if(JSON.stringify(S.decks[i])!==JSON.stringify(fresh)){S.decks[i]=fresh;changed=true}
      }
      if(!changed)return;
      sortDecks();
      const busy=S.view==="new"||(S.view==="deck"&&(S.tab==="edit"||S.session));
      if(S.view==="search")renderResults();
      else if(!busy)render();
    },()=>{});
  }catch(e){}
}

  setSync("Enregistrement…");

}
async function flush(){
  if(S.saving){S.saveTimer=setTimeout(flush,400);return}
  S.saving=true;
  const ids=[...S.dirty]; S.dirty.clear();
  try{
    for(const id of ids){
      const d=getDeck(id);
      if(d){const body=clone(d);delete body.id;await db.doc("decks/"+id).set(body)}
      else await db.doc("decks/"+id).delete();
    }
    setSync("Enregistré sur cet appareil");

    ids.forEach(i=>S.dirty.add(i));

}

/* Mini-markdown pour les fiches */
const IMG_RE=/^!\[(.*?)\]\((\S+?)\)\s*$/;
const safeUrl=u=>/^(https:\/\/|\/_blob\/|img\/[0-9a-f]{32}\.jpg$|data:image\/)/.test(u)?u:"";
function md(src){
  const lines=String(src||"").split("\n");let out="",inList=false,tbl=null,h=0,fig=0;
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/==(.+?)==/g,"<mark>$1</mark>").replace(/(^|\s)_(.+?)_(?=\s|$)/g,"$1<em>$2</em>");
  const closeList=()=>{if(inList){out+="</ul>";inList=false}};
  const flushT=()=>{if(!tbl)return;const rows=tbl.filter(r=>!/^\s*\|?\s*:?-{3,}/.test(r));
    out+='<div class="tblwrap"><table>'+rows.map((r,i)=>"<tr>"+r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>i===0?`<th>${inline(c.trim())}</th>`:`<td>${inline(c.trim())}</td>`).join("")+"</tr>").join("")+"</table></div>";tbl=null};
  for(const raw of lines){const l=raw.trimEnd();
    if(/^\s*\|/.test(l)){closeList();(tbl??=[]).push(l);continue}
    flushT();
    if(/^\s*-{3,}\s*$/.test(l)){closeList();out+="<hr>";continue}
    if(/^\s*\d{1,2}[.)]\s+/.test(l)){if(!inList){out+='<ul class="olist">';inList=true}const n=l.match(/^\s*(\d{1,2})/)[1];out+='<li><b class="oln">'+n+'.</b> '+inline(l.replace(/^\s*\d{1,2}[.)]\s+/,""))+"</li>";continue}
    if(/^\s*[-•]\s+/.test(l)){if(!inList){out+="<ul>";inList=true}out+="<li>"+inline(l.replace(/^\s*[-•]\s+/,""))+"</li>";continue}
    closeList();
    const im=l.match(IMG_RE);
    if(im){const u=safeUrl(im[2]);out+=`<figure id="fig-${fig++}">${u?`<img class="zoomable" data-act="zoom" data-src="${esc(u)}" src="${esc(u)}" alt="${esc(im[1])}" loading="lazy">`:`<div class="help">Image indisponible</div>`}<figcaption>${inline(im[1])}</figcaption></figure>`;continue}
    if(/^>\s?/.test(l)){out+=`<div class="callout">${inline(l.replace(/^>\s?/,""))}</div>`;continue}
    if(/^####\s+/.test(l))out+=`<h5 id="fs-${h++}">${inline(l.slice(5))}</h5>`;
    else if(/^###\s+/.test(l))out+=`<h4 id="fs-${h++}">${inline(l.slice(4))}</h4>`;
    else if(/^##\s+/.test(l))out+=`<h3 id="fs-${h++}">${inline(l.slice(3))}</h3>`;
    else if(/^#\s+/.test(l))out+=`<h2 id="fs-${h++}">${inline(l.slice(2))}</h2>`;
    else if(l.trim())out+="<p>"+inline(l)+"</p>";
  }
  flushT();closeList();return out;
}
const plain=s=>String(s||"").replace(/\*\*|==/g,"").replace(/^\s*[-•>|#]+\s*/gm,"").replace(/\|/g," · ");
function ficheSections(f){
  const out=[];let cur={h:"",body:[],k:null};
  for(const l of String(f||"").split("\n")){const m=l.match(/^(#{1,4})\s+(.*)/);
    if(m){if(cur.h||cur.body.length)out.push(cur);cur={h:m[2],body:[],k:out.filter(x=>x.k!==null).length+(cur.k===null&&!cur.h?0:0)};continue}
    if(!IMG_RE.test(l.trimEnd()))cur.body.push(l)}
  if(cur.h||cur.body.length)out.push(cur);
  let k=0;out.forEach(s=>{s.k=s.h?k++:null;s.body=plain(s.body.join("\n"))});return out;
}

/* Recherche : normalisation sans accents, index par mots, tolérance aux fautes */
const fold=s=>{let o="";for(const ch of String(s||""))o+=ch.normalize("NFD")[0];return o.toLowerCase()};
const tok=s=>fold(s).split(/[^a-z0-9α-ωœæ]+/).filter(Boolean);
const STOP=new Set("le la les de des du un une et en a au aux d l par pour sur dans que qui est ou se ce sa son ses avec sans".split(" "));
function isHeading(l){
  if(l.length<3||l.length>90)return false;
  if(/^(#{1,3}\s|[IVX]{1,4}\s*[-.–)]\s*\S|[IVX]{1,4}\.\d|\d{1,2}\s*[-.)–]\s*[A-Za-zÀ-ÿ]|[A-H]\s*[-.)]\s+[A-Za-zÀ-ÿ])/.test(l))return true;
  return l===l.toUpperCase()&&/[A-ZÀ-Ý]{4}/.test(l)&&l.length<70;
}
function srcChunks(text){
  const out=[];let cur=null,h="";
  for(const raw of String(text||"").split("\n")){const l=raw.trim();if(!l)continue;
    if(isHeading(l)){h=l;if(cur&&cur.t.length)out.push(cur);cur={h:l,t:""};continue}
    if(!cur)cur={h:"",t:""};
    if(cur.t.length>700){out.push(cur);cur={h:h?h+" (suite)":"",t:""}}
    cur.t+=(cur.t?"\n":"")+l}
  if(cur&&(cur.t.length||cur.h))out.push(cur);return out;
}
function buildIndex(){
  const E=[],V=new Map();
  const add=e=>{const i=E.length;E.push(e);for(const t of new Set(tok(e.title+" "+e.text))){let s=V.get(t);if(!s)V.set(t,s=[]);s.push(i)}};
  for(const d of S.decks){
    const b={deckId:d.id,mat:d.matiere||"Sans matière",chap:d.name};
    add({...b,type:"chapitre",tab:"fiche",title:d.name,text:[d.matiere,d.partie,d.source].filter(Boolean).join(" · "),w:10});
    ficheSections(d.fiche).forEach(s=>add({...b,type:"fiche",tab:"fiche",title:s.h||d.name,text:s.body,anchor:s.k!==null?"fs-"+s.k:null,w:s.h?4:2}));
    ficheFigures(d.fiche).forEach((f,n)=>add({...b,type:"schéma",tab:"fiche",title:f.cap||"Schéma",text:"",anchor:"fig-"+n,w:6}));
    (d.cards||[]).forEach(c=>add({...b,type:"carte",tab:"cards",title:c.q,text:c.a+(c.src?" · "+c.src:""),anchor:"card-"+c.id,w:3}));
    (d.qcm||[]).forEach(q=>add({...b,type:"qcm",tab:"qcm",title:q.q,text:q.options.join(" · ")+(q.expl?" · "+q.expl:""),anchor:"q-"+q.id,w:2}));
    const src=S.src.get(d.id);if(src&&src.text)srcChunks(src.text).forEach((c,n)=>add({...b,type:"source",tab:"source",title:c.h||"Cours source",text:c.t,anchor:"src-"+n,w:1}));
  }
  S.idx={E,V,keys:[...V.keys()]};
}
function lev(a,b,k){
  if(Math.abs(a.length-b.length)>k)return k+1;
  let prev=[];for(let j=0;j<=b.length;j++)prev[j]=j;
  for(let i=1;i<=a.length;i++){const cur=[i];let mn=i;
    for(let j=1;j<=b.length;j++){const v=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));cur[j]=v;if(v<mn)mn=v}
    if(mn>k)return k+1;prev=cur}
  return prev[b.length];
}
function queryTokens(q){return tok(q).filter(t=>!STOP.has(t))}
function search(q,f){
  if(!S.idx)buildIndex();
  const {E,V,keys}=S.idx,qt=queryTokens(q);
  if(!qt.length)return {res:[],qt};
  let scores=null;
  for(const t of qt){
    const m=new Map(),bump=(k,w)=>{for(const i of V.get(k)||[])if((m.get(i)||0)<w)m.set(i,w)};
    if(V.has(t))bump(t,1);
    if(t.length>=2)for(const k of keys)if(k!==t&&k.startsWith(t))bump(k,.75);
    if(t.length>=4){const K=t.length>=8?2:1;for(const k of keys){if(k===t||Math.abs(k.length-t.length)>K)continue;if(K===1&&k[0]!==t[0])continue;if(lev(t,k,K)<=K)bump(k,.45)}}
    if(scores===null)scores=m;else{const n=new Map();for(const [i,w] of m)if(scores.has(i))n.set(i,scores.get(i)+w);scores=n}
    if(!scores.size)break;
  }
  const fq=fold(q.trim()),res=[];
  for(const [i,s] of scores||[]){const e=E[i];
    if(f.mat&&e.mat!==f.mat)continue;if(f.deck&&e.deckId!==f.deck)continue;if(f.type&&e.type!==f.type)continue;
    let sc=s*e.w;if(fq.length>2){if(fold(e.title).includes(fq))sc+=e.w*2;else if(fold(e.text).includes(fq))sc+=e.w*.8}
    res.push({e,sc})}
  res.sort((a,b)=>b.sc-a.sc);
  return {res,qt};
}
function hilite(text,qt,max){
  text=String(text||"");const ft=fold(text);
  let pos=-1;for(const t of qt){const p=ft.indexOf(t);if(p>=0&&(pos<0||p<pos))pos=p}
  let start=0;if(max&&text.length>max){start=Math.max(0,(pos<0?0:pos)-50);text=text.slice(start,start+max)}
  const f2=fold(text),mark=new Array(text.length).fill(false);
  for(const t of qt){if(t.length<2)continue;let p=f2.indexOf(t);while(p>=0){for(let k=p;k<p+t.length&&k<text.length;k++)mark[k]=true;p=f2.indexOf(t,p+t.length)}}
  let o="",on=false;for(let k=0;k<text.length;k++){if(mark[k]!==on){o+=on?"</mark>":"<mark>";on=mark[k]}o+=esc(text[k])}
  if(on)o+="</mark>";
  return (start>0?"… ":"")+o+(max&&String(text).length>=max?" …":"");
}

/* Vérification de couverture : chiffres, sigles et titres du cours source comparés à la fiche + cartes + QCM */
const CAPSTOP=new Set("LES DES ET DE LA LE DU EN AU AUX UN UNE PAR POUR SUR DANS AVEC SANS OU QS NB EX CAS ROLE TYPE TYPES PLAN BUT BUTS UFR MED PHARM ATER UIDT UCAD CHU OMS".split(" "));
const ROMAN=/^(I|II|III|IV|V|VI|VII|VIII|IX|X|XI|XII)$/;
const UNIT_RE=/(?:^|[^A-Za-z0-9.,])((?:[<>≤≥][ \t]*)?(\d+(?:[.,]\d+)?)[ \t]*(%|kda|kg|mg|µg|µm|nm|mm3|mm|cm|ml|l\/mol|mmol|g\/l|g|jours?|j|heures?|h|min|ans|an|mois|semaines?|gy|ev|°c|millions?))(?![A-Za-zà-ÿ0-9])/gi;
function figsOf(txt){const out=new Map();let m;UNIT_RE.lastIndex=0;
  while((m=UNIT_RE.exec(txt))){const num=m[2].replace(",","."),u=fold(m[3]);const up=u==="%"?"%":/^(j|h)/.test(u)?u[0]:u.slice(0,2);
    out.set(num+"|"+up,{label:m[1].trim(),num,up})}
  return [...out.values()]}
function termsOf(txt){const out=new Map();
  for(const raw of txt.match(/[A-Za-zα-ωΑ-Ω][A-Za-z0-9α-ωΑ-Ω+\-]{1,13}/g)||[]){
    const t=raw.replace(/[-+]+$/,"");const up=(t.match(/[A-Z]/g)||[]).length,dig=/\d/.test(t);
    if(!(up>=2||(up>=1&&dig)))continue;
    if(/^[A-ZÀ-Ý]+$/.test(t)&&t.length>6)continue;
    if(ROMAN.test(t)||CAPSTOP.has(t.toUpperCase())&&/^[A-Z]+$/.test(t))continue;
    if(/^L\d$/.test(t)||/-[A-Z][a-zà-ÿ]/.test(t))continue;
    const key=fold(t).replace(/-/g,"");if(key.length<2)continue;out.set(key,{label:t,key})}
  return [...out.values()]}
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function coverage(d,text,ignore){
  const IG=new Set((ignore||[]).map(x=>fold(x)));
  const hay=fold([d.fiche,...(d.cards||[]).map(c=>c.q+" "+c.a),...(d.qcm||[]).map(q=>q.q+" "+q.options.join(" ")+" "+(q.expl||""))].join("\n")).replace(/-/g,"");
  const secs=[],byKey=new Map();let cur=null;
  for(const raw of String(text).split("\n")){const l=raw.trim();if(!l)continue;
    if(/(^|\s)(Dr|Pr)\.?\s+[A-Z]|Universit|UFR|Licence\s*3|Ann[ée]e universitaire|^Cours\s+L/i.test(l))continue;
    if(isHeading(l)){const key=fold(l).replace(/[^a-z0-9]+/g," ").trim();cur=byKey.get(key);if(!cur){cur={h:l,lines:[]};secs.push(cur);byKey.set(key,cur)}continue}
    if(!cur){cur={h:"Début du cours",lines:[],intro:true};secs.push(cur);byKey.set("_intro",cur)}
    cur.lines.push(l)}
  let tot=0,ok=0;
  for(const s of secs){
    const txt=s.lines.join("\n"),items=[];
    for(const f of figsOf(txt)){const r=new RegExp("(^|[^0-9.,])"+f.num.replace(".","[.,]")+"\\s*"+(f.up==="%"?"%":reEsc(f.up)));items.push({kind:"chiffre",label:f.label,ok:r.test(hay)})}
    for(const t of termsOf(txt)){const r=new RegExp("(^|[^a-z0-9α-ω])"+reEsc(t.key)+"(?![a-z0-9α-ω])");items.push({kind:"sigle",label:t.label,ok:r.test(hay)})}
    if(!s.intro){const hw=tok(s.h).filter(w=>w.length>=5&&!/^[ivx]+$/.test(w));if(hw.length){const n=hw.filter(w=>hay.includes(w)).length;items.push({kind:"titre",label:s.h,ok:n/hw.length>=.5})}}
    const kept=items.filter(i=>!IG.has(fold(i.label)));s.ignored=items.length-kept.length;s.items=kept;const n=kept.length,k=kept.filter(i=>i.ok).length;tot+=n;ok+=k;
    s.status=!n?"nv":k===0?"nt":k/n>=.7?"ok":"part";
  }
  const hay2=fold([d.fiche,...(d.cards||[]).map(c=>c.q+" "+c.a),...(d.qcm||[]).map(q=>q.q+" "+q.options.join(" ")+" "+(q.expl||""))].join("\n"));
  const hw=new Set([...tok(hay2),...tok(hay)].map(w=>w.slice(0,5)));const lines=[];
  for(const s of secs)for(const l of s.lines){const ws=tok(l).filter(w=>w.length>=5&&!/^\d+$/.test(w)&&!STOP.has(w));if(ws.length<2)continue;const k=ws.filter(w=>hw.has(w.slice(0,5))).length;lines.push({sec:s.h,l,ok:k/ws.length>=.6})}
  const ig=secs.reduce((n,s)=>n+(s.ignored||0),0);
  return {secs:secs.filter(s=>s.lines.length||s.items.length),tot,ok,ig,lines};
}

function tabQcm(d){

function readEdit(){

/* Minuteur Pomodoro */
const T={mode:"travail",left:25*60,running:false,end:0,iv:null,done:0};
const DUR={travail:25*60,pause:5*60};
function tickTimer(){
  if(T.running){T.left=Math.max(0,Math.round((T.end-Date.now())/1000));
    if(T.left===0){T.running=false;clearInterval(T.iv);if(T.mode==="travail")T.done++;T.mode=T.mode==="travail"?"pause":"travail";T.left=DUR[T.mode];toast(T.mode==="pause"?"Séance terminée, place à la pause":"Pause terminée");if(S.view==="timer")render();return}}
  const el=$("#clock");if(el)el.textContent=String(Math.floor(T.left/60)).padStart(2,"0")+":"+String(T.left%60).padStart(2,"0");
}

function chapProgress(d){

  const learned=d.learnedOn?1:0,j=(d.jDone||[]).length/5,q=d.lastScore!=null?Math.min(1,d.lastScore/100):0;

}

}
function classStatus(e){
  const st=classSteps(e),pct=Math.round(st.reduce((n,[,v])=>n+(v===true?1:v===false?0:v),0)/st.length*100);

}

let ERRC=null;const errDirty=()=>{ERRC=null};
function errItems(mat){
  if(!mat&&ERRC&&Date.now()-ERRC.t<3000)return ERRC.v;
  const out=[];
  for(const d of S.decks){if(mat&&(d.matiere||"Sans matière")!==mat)continue;

/* ---------- estimation du temps ---------- */
function calib(){
  const r=X.sessions.filter(s=>s.est>0&&s.progress>=.9&&s.activeMin>3).map(s=>s.activeMin/s.est).sort((a,b)=>a-b);
  if(r.length<2)return 1;return Math.max(.6,Math.min(1.8,r[Math.floor(r.length/2)]));
}
function diffFactor(d){
  const comps=X.classes.filter(x=>x.deckId===d.id&&x.comp).sort((a,b)=>a.date.localeCompare(b.date));
  let f=1;const comp=comps.length?comps[comps.length-1].comp:null;
  if(comp)f+=(3-comp)*.12;f+=Math.min(.3,errRate(d)*.6);
  return Math.max(.8,Math.min(1.6,f));
}
function estimate(d){
  const f=diffFactor(d)*calib();
  const read=Math.max(8,words(plain(d.fiche))/40)*f;
  const cards=(d.cards||[]).length*.6*f,qcm=(d.qcm||[]).length*1.5*f,err=Math.min(25,errItems().filter(x=>x.deckId===d.id).length*1.5)*f;
  const r={read:Math.round(read),cards:Math.round(cards),qcm:Math.round(qcm),err:Math.round(err)};r.total=r.read+r.cards+r.qcm+r.err;r.f=f;return r;
}
const revMin=d=>{const e=estimate(d);return Math.max(15,Math.round(e.read*.35+Math.min(e.cards,25)+e.qcm*.5))};

/* ---------- notes du professeur sans doublon ---------- */
function mergeNotes(existing,incoming){
  const ex=String(existing||"").split("\n").map(l=>l.trimEnd()).filter(l=>l.trim());
  const keys=ex.map(normLine);let added=0,skipped=0;
  for(const raw of String(incoming||"").split("\n")){const l=raw.trimEnd();if(!l.trim())continue;const k=normLine(l);if(!k)continue;
    if(keys.some(x=>x===k||(k.length>12&&jac(x,k)>=.85))){skipped++;continue}
    ex.push(l);keys.push(k);added++}
  return {text:ex.join("\n"),added,skipped};
}
function similarDeck(name,mat){
  const k=normLine(name);if(!k)return null;let best=null,bs=0;
  for(const d of S.decks){if(mat&&(d.matiere||"")&&normLine(d.matiere)!==normLine(mat))continue;const s=normLine(d.name)===k?1:jac(normLine(d.name),k);if(s>bs){bs=s;best=d}}
  return bs>=.5?best:null;
}

async function pdfLib(){if(PDFL)return PDFL;try{globalThis.pdfjsWorker=await import(PDFW);const L=await import(PDFJS);L.GlobalWorkerOptions.workerSrc=PDFW;PDFL=L;return L}catch(e){throw {message:"Lecteur PDF indisponible sur cet appareil ou ce navigateur."}}}
async function renderPage(pg,maxSide,q){const vp=pg.getViewport({scale:1});const sc=Math.min(2,maxSide/Math.max(vp.width,vp.height));const v2=pg.getViewport({scale:sc});const cv=document.createElement("canvas");cv.width=Math.round(v2.width);cv.height=Math.round(v2.height);const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);await pg.render({canvas:cv,canvasContext:ctx,viewport:v2}).promise;return canvasBlob(cv,q)}
const kindOf=f=>{const n=f.name.toLowerCase();if(n.endsWith(".pdf")||f.type==="application/pdf")return "pdf";if(n.endsWith(".pptx"))return "pptx";if(n.endsWith(".ppt"))return "ppt";if(n.endsWith(".docx"))return "docx";if(/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|heic)$/.test(n))return "image";if(/\.(txt|md|csv)$/.test(n)||/^text\//.test(f.type))return "text";return "autre"};
function canvasBlob(cv,q=.82){return new Promise(r=>cv.toBlob(b=>r(b),"image/jpeg",q))}
function impRefresh(){const el=document.getElementById("imp-box");if(el)el.innerHTML=impInner();else if(S.view==="classe"||S.view==="plan")render()}
function impLog(f,msg){f.status=msg;impRefresh()}

async function readFiles(files,purpose){
  X.imp=X.imp&&X.imp.purpose===purpose?X.imp:{purpose,files:[],text:"",busy:false};
  const imp=X.imp;imp.busy=true;
  for(const file of files){
    const f={name:file.name,kind:kindOf(file),size:file.size,file,status:"En attente",pages:[],text:""};imp.files.push(f);impRefresh();
    try{
      if(f.kind==="pdf")await readPdf(f);
      else if(f.kind==="pptx")await readPptx(f);
      else if(f.kind==="docx")await readDocx(f);
      else if(f.kind==="image"){f.pages=[{n:1,text:"",blob:file,thumb:URL.createObjectURL(file),needOcr:true}];await ocrPages(f);}
      else if(f.kind==="text"){f.text=await file.text();f.status="Texte lu"}
      else if(f.kind==="ppt"){f.status="Ancien format .ppt : enregistre-le en .pptx ou en PDF, puis réimporte-le."}
      else f.status="Format non pris en charge";
      if(f.pages.length)f.text=f.pages.map(p=>(f.kind==="pptx"?"[Diapo ":"[Page ")+p.n+"]\n"+(p.text||"").trim()).join("\n\n");
    }catch(e){f.status="Erreur : "+aiErr(e)}
    impRefresh();
  }
  imp.text=imp.files.filter(f=>f.text).map(f=>(imp.files.length>1?"=== "+f.name+" ===\n":"")+f.text).join("\n\n");
  imp.busy=false;impRefresh();
}
async function readPdf(f){
  impLog(f,"Ouverture du PDF…");
  const L=await pdfLib();const pdf=await L.getDocument({data:await f.file.arrayBuffer()}).promise;
  for(let i=1;i<=pdf.numPages;i++){
    impLog(f,`Lecture page ${i}/${pdf.numPages}…`);
    const pg=await pdf.getPage(i);const tc=await pg.getTextContent();
    const text=tc.items.map(it=>it.str+(it.hasEOL?"\n":" ")).join("").replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n");
    const blob=await renderPage(pg,1400,.82);
    f.pages.push({n:i,text,blob,thumb:URL.createObjectURL(blob),needOcr:text.replace(/\s/g,"").length<40});
  }
  if(f.pages.some(p=>p.needOcr))await ocrPages(f);else f.status=`${pdf.numPages} pages lues`;
}
async function readPptx(f){
  impLog(f,"Ouverture du PowerPoint…");await loadScript(JSZIP);
  const zip=await window.JSZip.loadAsync(await f.file.arrayBuffer());
  const num=n=>+n.match(/(\d+)\.xml$/)[1];
  const slides=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>num(a)-num(b));
  const P=new DOMParser();
  for(const n of slides){const i=num(n);impLog(f,`Lecture diapo ${i}/${slides.length}…`);
    const doc=P.parseFromString(await zip.file(n).async("string"),"application/xml");
    const lines=[...doc.getElementsByTagNameNS("*","p")].map(p=>[...p.getElementsByTagNameNS("*","t")].map(t=>t.textContent).join("")).filter(s=>s.trim());
    let blob=null;const rel=zip.file(`ppt/slides/_rels/slide${i}.xml.rels`);
    if(rel){const rd=P.parseFromString(await rel.async("string"),"application/xml");
      const tg=[...rd.getElementsByTagName("Relationship")].filter(r=>/\/image$/.test(r.getAttribute("Type"))).map(r=>"ppt/"+r.getAttribute("Target").replace(/^\.\.\//,""));
      let best=null,bt="";for(const t of tg){const zf=zip.file(t);if(!zf||!/\.(png|jpe?g|gif|webp)$/i.test(t))continue;const b=await zf.async("blob");if(!best||b.size>best.size){best=b;bt=t}}
      if(best&&best.size>8000){const ty=/\.png$/i.test(bt)?"image/png":/\.gif$/i.test(bt)?"image/gif":/\.webp$/i.test(bt)?"image/webp":"image/jpeg";blob=new Blob([best],{type:ty})}}
    const tx=lines.join("\n");
    f.pages.push({n:i,text:tx,blob,thumb:blob?URL.createObjectURL(blob):null,needOcr:!!blob&&tx.replace(/\s/g,"").length<40,slideImg:!!blob});
  }
  f.status=`${slides.length} diapos lues`+(f.pages.some(p=>p.slideImg)?" · images trouvées":"");
  if(f.pages.some(p=>p.needOcr))await ocrPages(f);
}
async function readDocx(f){
  impLog(f,"Ouverture du document Word…");await loadScript(JSZIP);
  const zip=await window.JSZip.loadAsync(await f.file.arrayBuffer());const x=zip.file("word/document.xml");if(!x)throw new Error("document vide");
  const doc=new DOMParser().parseFromString(await x.async("string"),"application/xml");
  f.text=[...doc.getElementsByTagNameNS("*","p")].map(p=>[...p.getElementsByTagNameNS("*","t")].map(t=>t.textContent).join("")).filter(s=>s.trim()).join("\n");f.status="Document lu";
}
async function ocrPages(f){
  const todo=f.pages.filter(p=>p.needOcr&&p.blob);if(!todo.length)return;
  if(!SAMPLE||!SLIM?.images){f.status=`${todo.length} page(s) scannée(s) : lecture impossible ici (ouvre le site dans Claude).`;return}
  const per=Math.max(1,Math.min(SLIM.images.maxCount||5,6));
  for(let i=0;i<todo.length;i+=per){const grp=todo.slice(i,i+per);
    impLog(f,`Lecture des pages scannées (OCR) ${i+1}–${i+grp.length} / ${todo.length}…`);
    const prompt=`Voici ${grp.length} image(s) de pages d'un cours de médecine (pages ${grp.map(p=>p.n).join(", ")}). Transcris FIDÈLEMENT tout le texte visible, dans l'ordre de lecture, en conservant les titres, listes, numérotations et tableaux (tableau au format | a | b |). Décris entre crochets, en une phrase, chaque schéma ou figure et recopie ses légendes. N'invente rien, ne corrige rien ; si un mot est illisible écris [illisible]. Commence chaque page par une ligne « [Page N] » (N = numéro donné ci-dessus, dans l'ordre des images). Réponds uniquement avec la transcription.`;
    const {text}=await ask(prompt,{images:grp.map(p=>p.blob)});
    const parts=text.split(/\[Page\s+(\d+)\]/);
    if(parts.length>1){for(let k=1;k<parts.length;k+=2){const p=grp.find(x=>x.n===+parts[k])||grp[(k-1)/2];if(p){p.text=(p.text?p.text+"\n":"")+parts[k+1].trim();p.ocr=true}}}
    else{grp[0].text=text;grp[0].ocr=true}
  }
  f.status=`${f.pages.length} page(s) · ${todo.length} lue(s) par OCR`;
}

  <label class="f">Texte extrait (tu peux le corriger)<textarea id="imp-text" rows="9">${esc(imp.text)}</textarea></label>

      <button class="btn ghost" data-act="cprof">Ajouter aux notes du prof (sans doublon)</button>${aiOK()?"":noAI}</div>`:""}`}`;

/* ---------- Génération fiche + flashcards + QCM à partir d'un cours importé ---------- */
function jobShow(title){X.job={title,lines:[],ctl:new AbortController(),done:false};jobRender();return X.job}
function jobLog(m){if(!X.job)return;X.job.lines.push(m);jobRender()}
function jobRender(){const o=$("#overlay");const j=X.job;if(!j){o.innerHTML="";return}
  o.innerHTML=`<div class="sheet"><div class="box"><div class="label">Claude travaille</div><h3>${esc(j.title)}</h3><div class="stack" style="gap:4px;max-height:40vh;overflow:auto">${j.lines.map(l=>`<div class="help">${esc(l)}</div>`).join("")}</div>${j.done?`<button class="btn" data-act="jobclose">Fermer</button>`:`<div class="row"><span class="spin" aria-hidden="true"></span><span class="help">Cela peut prendre quelques minutes pour un long cours.</span></div><button class="btn ghost" data-act="jobstop">Arrêter</button>`}</div></div>`}
function chunksOf(text,max){const out=[];let cur="";for(const l of text.split("\n")){if(cur.length+l.length>max&&cur){out.push(cur);cur=""}cur+=l+"\n"}if(cur.trim())out.push(cur);return out}
async function genChapter(d,text,figs){
  const job=jobShow("Fiche, flashcards et QCM · "+d.name);const signal=job.ctl.signal;
  try{
    let figTxt="";
    if(figs.length){
      if(!ASSETS)throw {message:"L'ajout de schémas demande les droits d'édition du site."};
      jobLog(`Enregistrement de ${figs.length} schéma(s) original(aux)…`);
      for(const g of figs){if(!g.url){const r=await ASSETS.upload(g.blob,{type:g.blob.type||"image/jpeg"});g.url=r.url||("/_blob/"+r.id);g.id=r.id}}
      figTxt=`\n5. Schémas originaux disponibles. Insère CHACUN sur sa propre ligne, à l'endroit du plan où il apparaît dans le cours, avec la syntaxe {{N|légende courte}} (N = numéro de page/diapo), puis une ligne « > » qui explique en une phrase ce qu'il montre, uniquement d'après le cours : ${figs.map(g=>g.unit+" "+g.n).join(", ")}.`;
    }
    const base=`Chapitre « ${d.name} »${d.matiere?" ("+d.matiere+")":""}, cours de L3 de médecine.`;
    jobLog("Rédaction de la fiche synthétique (plan exact du cours)…");
    const fp=`${base}\nRédige la FICHE SYNTHÉTIQUE de ce cours.\nRègles absolues :\n1. Respecte exactement le plan du cours : mêmes titres, sous-titres, parties et sous-parties, dans le même ordre, avec leur numérotation d'origine (même si elle est incohérente). Ne fusionne, ne déplace et ne supprime aucune rubrique, y compris Objectifs et Plan.\n2. Chaque connaissance évaluable doit apparaître (définitions, chiffres, valeurs normales, classifications, signes, mécanismes, causes, examens, traitements, listes complètes). Tu peux raccourcir les phrases, jamais supprimer une connaissance.\n3. ${COURSE_RULE} Si le cours contient une incohérence ou une coquille, garde-la et signale-la sur une ligne « > ⚠ À vérifier : … ».\n4. Format : « # » titre du chapitre, « ## » parties, « ### » et « #### » sous-parties ; « - » listes ; **gras** pour les mots-clés ; ==surligné== pour l'indispensable ; tableaux « | a | b | » quand le cours compare ; « > » pour les encadrés. Aucune autre syntaxe, pas de HTML.${figTxt}\nRéponds uniquement avec la fiche.\n\nCOURS :\n<<<\n${text}\n>>>`;
    let fiche="",r=await ask(fp,{modelTier:"complex",signal});fiche=r.text;let k=0;
    while(r.truncated&&k<3){k++;jobLog("La fiche est longue : suite de la rédaction…");
      r=await ask(fp+`\n\nTu as déjà rédigé le début de la fiche. Voici ses dernières lignes :\n<<<\n${fiche.slice(-3000)}\n>>>\nContinue EXACTEMENT là où elle s'arrête, sans rien répéter.`,{modelTier:"complex",signal});fiche+="\n"+r.text}
    for(const g of figs)fiche=fiche.replace(new RegExp(`\\{\\{${g.n}\\|([^}]*)\\}\\}`,"g"),(m,t)=>`![${g.unit} ${g.n} · ${t.trim()}](${g.url})`);
    fiche=fiche.replace(/\{\{\d+\|[^}]*\}\}/g,"");
    jobLog("Flashcards (une information par carte)…");
    const parts=chunksOf(text,26000);let cards=[],plan=[];
    for(let i=0;i<parts.length;i++){if(parts.length>1)jobLog(`… partie ${i+1}/${parts.length}`);
      const o=await askJSON(`${base}\nÀ partir de cette ${parts.length>1?`PARTIE ${i+1}/${parts.length} du `:""}COURS, produis un objet JSON {"plan":[...],"cards":[...]} :\n- "plan" : TOUS les titres et sous-titres présents dans ce texte, recopiés exactement, dans l'ordre.\n- "cards" : des flashcards couvrant TOUTES les connaissances évaluables, dans l'ordre du cours. Une seule information précise par carte ; question courte et sans ambiguïté ; réponse complète mais concise (listes complètes quand le cours donne une liste). Chaque carte : {"q":"…","a":"…","s":"titre de la section"}. ${COURSE_RULE}\nRéponds uniquement avec le JSON.\n\nCOURS :\n<<<\n${parts[i]}\n>>>`,{signal});
      if(Array.isArray(o?.plan))plan.push(...o.plan.map(String));if(Array.isArray(o?.cards))cards.push(...o.cards.filter(c=>c&&c.q&&c.a))}
    jobLog(`${cards.length} flashcards. QCM corrigés…`);
    const qs=await askJSON(`${base}\nÀ partir du COURS, écris entre 10 et 20 QCM d'examen (style faculté de médecine) couvrant les notions les plus évaluables. Chaque QCM : 5 propositions (A à E), de 1 à 5 justes. Les propositions fausses doivent être fausses d'après le cours (pas de piège ambigu). "expl" = correction détaillée : pour chaque proposition, la lettre, Vrai/Faux et la justification tirée du cours. ${COURSE_RULE}\nFormat : tableau JSON [{"q":"…","options":["…","…","…","…","…"],"correct":[0,2],"expl":"A. Vrai : … B. Faux : …"}]. Réponds uniquement avec le JSON.\n\nCOURS :\n<<<\n${text.slice(0,90000)}\n>>>`,{signal});
    const qcm=(Array.isArray(qs)?qs:[]).filter(q=>q&&q.q&&Array.isArray(q.options)&&q.options.length>=2&&Array.isArray(q.correct)&&q.correct.length).map(q=>({id:uid(),q:String(q.q),options:q.options.map(String).slice(0,8),correct:q.correct.map(Number).filter(n=>n>=0&&n<q.options.length),expl:String(q.expl||""),gen:true}));
    // fusion sans doublon et sans perte de progression
    const live=getDeck(d.id);if(!live)throw {message:"Chapitre introuvable"};
    const hadFiche=!!(live.fiche||"").trim();
    if(hadFiche&&normLine(live.fiche)!==normLine(fiche)){live.ficheAvant=live.fiche}
    live.fiche=fiche.trim();
    const seenQ=new Set((live.cards||[]).map(c=>normLine(c.q)));let addC=0;
    for(const c of cards){const k2=normLine(c.q);if(seenQ.has(k2))continue;seenQ.add(k2);(live.cards??=[]).push({id:uid(),q:String(c.q),a:String(c.a),src:c.s?String(c.s):"",box:0,due:null,gen:true});addC++}
    const seenM=new Set((live.qcm||[]).map(q=>normLine(q.q)));let addQ=0;
    for(const q of qcm){const k2=normLine(q.q);if(seenM.has(k2))continue;seenM.add(k2);(live.qcm??=[]).push(q);addQ++}
    markDirty(live.id);
    const prevSrc=S.src.get(live.id)||{};
    const srcBody={...prevSrc,text:prevSrc.text&&!prevSrc.text.includes(text.slice(0,200))?prevSrc.text+"\n\n"+text:text,file:prevSrc.file||(X.imp?.files||[]).map(f=>f.name).join(", "),origin:"importé dans le site",updatedAt:today(),plan:[...new Set(plan.map(s=>s.trim()).filter(Boolean))],figs:figs.map(g=>({p:g.n,t:""})),unit:figs[0]?.unit||"Diapo"};
    S.src.set(live.id,srcBody);S.idx=null;if(db){try{await db.doc("sources/"+live.id).set(srcBody)}catch(e){jobLog("⚠ Cours source non enregistré")}}else saveSource(live.id,srcBody.text);
    jobLog(`✓ Fiche ${hadFiche?"mise à jour (l'ancienne est gardée dans « ficheAvant »)":"créée"} · ${addC} flashcards ajoutées · ${addQ} QCM ajoutés${cards.length-addC?` · ${cards.length-addC} doublons ignorés`:""}.`);
    jobLog("Vérifie l'onglet Couverture pour contrôler que rien ne manque.");
  }catch(e){jobLog("✗ "+aiErr(e))}
  job.done=true;jobRender();render();
}

  return topbar(f.id&&X.classes.some(x=>x.id===f.id)?"Modifier le cours suivi":"Cours suivi",true)+`<div class="stack">

function wrapText(t,n){const w=String(t).split(/\s+/);const out=[];let cur="";for(const x of w){if((cur+" "+x).trim().length>n&&cur){out.push(cur);cur=x}else cur=(cur+" "+x).trim()}if(cur)out.push(cur);return out.slice(0,3)}
function flowSVG(sch){
  const N=(sch?.noeuds||[]).slice(0,14),E=(sch?.liens||[]).filter(l=>N.some(n=>n.id===l.de)&&N.some(n=>n.id===l.a));
  if(N.length<2)return "";
  const lvl={};N.forEach(n=>lvl[n.id]=0);
  for(let k=0;k<N.length;k++)for(const l of E)if(lvl[l.a]<=lvl[l.de]&&lvl[l.de]<N.length)lvl[l.a]=lvl[l.de]+1;
  const rows={};N.forEach(n=>(rows[lvl[n.id]]??=[]).push(n));
  const W=360,BH=58,GY=40;const pos={},bw={};let y=10;const keys=Object.keys(rows).map(Number).sort((a,b)=>a-b);
  for(const k of keys){const r=rows[k];const w=Math.min(170,(W-12*(r.length+1))/r.length);const gap=(W-r.length*w)/(r.length+1);r.forEach((n,i)=>{pos[n.id]={x:gap+i*(w+gap),y,w};bw[n.id]=w});y+=BH+GY}
  const H=y-GY+10;
  const edges=E.map(l=>{const a=pos[l.de],b=pos[l.a];const x1=a.x+a.w/2,y1=a.y+BH,x2=b.x+b.w/2,y2=b.y;const back=y2<=y1;
    const path=back?`M${a.x+a.w},${a.y+BH/2} C${a.x+a.w+40},${a.y+BH/2} ${b.x+b.w+40},${b.y+BH/2} ${b.x+b.w+4},${b.y+BH/2}`:`M${x1},${y1} C${x1},${y1+GY/2} ${x2},${y2-GY/2} ${x2},${y2-4}`;
    const mx=(x1+x2)/2,my=back?(a.y+b.y)/2+BH/2:(y1+y2)/2;
    return `<path d="${path}" fill="none" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#ah)"/>${l.label?`<text x="${mx+6}" y="${my}" font-size="11" fill="var(--muted)">${esc(String(l.label).slice(0,26))}</text>`:""}`}).join("");
  const nodes=N.map(n=>{const p=pos[n.id],ls=wrapText(n.label,Math.max(10,Math.floor(p.w/7.4)));const ty=p.y+BH/2-(ls.length-1)*7+4;
    return `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${BH}" rx="12" fill="var(--scrub-soft)" stroke="var(--scrub)" stroke-width="1.5"/>${ls.map((t,i)=>`<text x="${p.x+p.w/2}" y="${ty+i*14}" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">${esc(t)}</text>`).join("")}`}).join("");
  return `<figure class="flow"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sch.titre||"Schéma")}"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>${edges}${nodes}</svg>${sch.titre?`<figcaption>${esc(sch.titre)} · schéma pédagogique construit d'après le cours</figcaption>`:""}</figure>`;
}

function fixedFor(date){
  const P=X.planning||DEF_PLAN(),wd=wdOf(date),out=[];
  const add=(x,kind)=>{const s=toMin(x.start),e=toMin(x.end);if(s==null||e==null||e<=s)return;out.push({s,e,title:x.title||x.matiere||"",kind,ref:x.id,lieu:x.lieu||"",type:x.type||"",flex:!!x.flex})};
  (P.edt||[]).forEach(x=>{if(noClass(date))return;if(+x.day===wd&&(!x.from||date>=x.from)&&(!x.to||date<=x.to))add(x,"cours")});
  (P.habits||[]).forEach(x=>{if((x.days||[]).map(Number).includes(wd)&&!(x.skip||[]).includes(date))add(x,"habitude")});
  (P.obligations||[]).forEach(x=>{if(x.date?x.date===date:(x.days||[]).map(Number).includes(wd))add(x,"obligation")});
  ((X.plans[date]||{}).extra||[]).forEach(x=>add(x,"imprévu"));
  return out.sort((a,b)=>a.s-b.s||a.e-b.e);
}
function conflicts(fixed){const c=[];for(let i=0;i<fixed.length;i++)for(let j=i+1;j<fixed.length;j++)if(!fixed[i].flex&&!fixed[j].flex&&fixed[j].s<fixed[i].e&&fixed[j].e>fixed[i].s)c.push([fixed[i],fixed[j]]);return c}
function tasksFor(date){
  const P=X.planning||DEF_PLAN(),pr=m=>+(P.priorities?.[m]||2),T=[],seen=new Set();
  const push=t=>{if(seen.has(t.key))return;seen.add(t.key);t.prio+=(pr(t.mat)-2)*6;T.push(t)};
  // 1. cours suivis récemment, pas encore appris
  X.classes.filter(e=>e.date<=date&&e.date>=addDays(date,-3)).forEach(e=>{const d=getDeck(e.deckId);if(!d||d.learnedOn)return;
    const L=dayLoad(e.date);push({key:"learn:"+d.id,deckId:d.id,mat:d.matiere,title:(L.lvl==="lourde"?"J0 allégé · Survol + Blurting : ":"J0 · Comprendre + Blurting : ")+d.name,min:j0Min(e,d,L.lvl),prio:100,kind:"learn",tab:"lesson"})});
  // 1 ter. nouvelle partie d'un chapitre déjà commencé (ex. 2e cours sur le même support)
  X.classes.filter(e=>e.date<=date&&e.date>=addDays(date,-2)).forEach(e=>{const d=getDeck(e.deckId);if(!d||!d.learnedOn||e.date<=d.learnedOn)return;const k="part:"+e.id;if(keyDone(k))return;
    const L=dayLoad(e.date);push({key:k,deckId:d.id,mat:d.matiere,title:"J0 nouvelle partie · "+(e.titre||d.name),min:j0Min(e,d,L.lvl),prio:99,kind:"learn",tab:"lesson"})});
  // 1 bis. le jour même : revoir chaque cours de l'emploi du temps juste après l'avoir eu
  fixedFor(date).filter(f=>f.kind==="cours").forEach(f=>{
    const cl=X.classes.find(e=>e.date===date&&e.deckId&&getDeck(e.deckId)&&fold(e.matiere||getDeck(e.deckId).matiere||"").includes(fold(f.title).slice(0,6)));

    push({key:"post:"+f.ref+":"+date,deckId:null,mat:f.title,title:"Revoir le cours du jour : "+f.title,min:f.e>=18*60?45:Math.max(45,Math.min(90,Math.round((f.e-f.s)*.5/5)*5)),prio:98,kind:"post",after:f.e+10})});

    const heavy=n===1&&dayLoad(d.learnedOn).lvl==="lourde";
    push({key:`J${n}:${d.id}`,deckId:d.id,mat:d.matiere,title:`J${n} · ${heavy?"Approfondir + objectifs":MAJ[n].t} · ${d.name}`,min:revMin(d)+(heavy?Math.round(slidesOf(X.classes.find(e=>e.deckId===d.id&&e.date===d.learnedOn),d)*.4/5)*5:0),prio:dd<date?95:90,kind:"J",rev:true,j:n,tab:heavy?"lesson":MAJ[n].tab})});

  if(wdOf(date)===7){const wk=S.decks.filter(d=>d.learnedOn&&d.learnedOn>=addDays(date,-7)&&(d.qcm||[]).length);if(wk.length&&!keyDone("bilan:"+date))push({key:"bilan:"+date,deckId:null,mat:"",title:`Bilan de la semaine · QCM mélangés (${wk.length} cours)`,min:Math.min(60,20+wk.length*5),prio:85,kind:"bilan"})}
  // 3. partiels dans les 21 jours
  [...(P.exams||[]),...calExams(date)].filter(e=>e.date>=date&&e.date<=addDays(date,21)).forEach(e=>{const days=Math.max(1,Math.round((new Date(e.date)-new Date(date))/864e5));
    S.decks.filter(d=>(d.matiere||"")===e.matiere&&(!e.cal||d.learnedOn||X.classes.some(c=>c.deckId===d.id))).map(d=>({d,p:chapProgress(d)})).filter(x=>x.p<75).sort((a,b)=>a.p-b.p).slice(0,days<=7?3:2).forEach(({d})=>
      push({key:"exam:"+d.id,deckId:d.id,mat:d.matiere,title:`${e.cal?"Examens":"Partiel "+e.matiere} (J-${days}) · ${d.name}`,min:d.learnedOn?revMin(d):Math.min(120,estimate(d).total),prio:80+Math.max(0,21-days),kind:"exam",rev:!!d.learnedOn}))});
  // 4. flashcards dues
  S.decks.forEach(d=>{const n=(d.cards||[]).filter(c=>!c.due||c.due<=date).filter(c=>c.due||((c.box||0)>0)).length;if(n>=3)push({key:"cards:"+d.id,deckId:d.id,mat:d.matiere,title:`Flashcards · ${d.name} (${n})`,min:Math.max(10,Math.min(40,Math.ceil(n*.5))),prio:60,kind:"cards"})});

  fresh.forEach((d,k)=>{const e=estimate(d);push({key:"start:"+d.id,deckId:d.id,mat:d.matiere,title:"Apprendre : "+d.name,min:Math.max(60,Math.min(120,Math.round((e.read*2+Math.min(e.cards,30))/5)*5)),prio:45-k,kind:"learn"})});
  return T.sort((a,b)=>b.prio-a.prio);
}

function schedule(date){

function validT(t){return toMin(t)!=null?hm(toMin(t)):null}
function applyOps(ops){
  const P=X.planning;let n=0;const days=a=>(Array.isArray(a)?a:[a]).map(Number).filter(x=>x>=1&&x<=7);
  for(const o of ops){try{
    const s=validT(o.start),e=validT(o.end);
    switch(o.op){
      case "add_habit":if(s&&e&&toMin(e)>toMin(s)&&o.title){(P.habits??=[]).push({id:uid(),title:String(o.title),days:days(o.days),start:s,end:e});n++}break;
      case "add_obligation":if(s&&e&&o.title){(P.obligations??=[]).push({id:uid(),title:String(o.title),date:o.date||null,days:o.date?[]:days(o.days||[]),start:s,end:e});n++}break;
      case "add_course":if(s&&e&&o.title&&o.day){(P.edt??=[]).push({id:uid(),title:String(o.title),day:+o.day,start:s,end:e,type:o.type||"",lieu:o.lieu||""});n++}break;
      case "add_exam":if(o.matiere&&/^\d{4}-\d\d-\d\d$/.test(o.date)){(P.exams??=[]).push({id:uid(),matiere:String(o.matiere),date:o.date});n++}break;
      case "set_priority":if(o.matiere){(P.priorities??={})[o.matiere]=Math.max(1,Math.min(3,+o.level||2));n++}break;
      case "set_pref":if(["dayStart","dayEnd"].includes(o.key)&&validT(o.value)){P.prefs[o.key]=validT(o.value);n++}else if(["maxStudyMin","block","pause"].includes(o.key)&&+o.value>=0){P.prefs[o.key]=+o.value;n++}break;
      case "remove":if(P[o.list]){const l=P[o.list].length;P[o.list]=P[o.list].filter(x=>x.id!==o.id);if(P[o.list].length<l)n++}break;
      case "update":if(P[o.list]){const x=P[o.list].find(y=>y.id===o.id);if(x&&o.fields){const f=o.fields;["title","type","lieu","date"].forEach(k=>{if(f[k]!=null)x[k]=String(f[k])});if(f.start&&validT(f.start))x.start=validT(f.start);if(f.end&&validT(f.end))x.end=validT(f.end);if(f.days)x.days=days(f.days);if(f.day)x.day=+f.day;n++}}break;
      case "add_imprevu":if(s&&e&&/^\d{4}-\d\d-\d\d$/.test(o.date)){const p=X.plans[o.date]||(X.plans[o.date]={id:o.date,date:o.date,blocks:[],extra:[]});(p.extra??=[]).push({id:uid(),title:String(o.title||"Imprévu"),start:s,end:e});n++}break;
      case "remove_imprevu":{const p=X.plans[o.date];if(p&&p.extra){const l=p.extra.length;p.extra=p.extra.filter(x=>o.title&&normLine(x.title)!==normLine(o.title));if(!o.title)p.extra=[];if(p.extra.length<l)n++}break}
    }}catch(e){}}
  return n;
}

async function edtImport(files,text){

function passagesFor(q){

  if(one){
    ficheSections(one.fiche).forEach(s=>{if((s.h||s.body).trim())out.push({deckId:one.id,tab:"fiche",anchor:s.k!=null?"fs-"+s.k:null,label:one.name+(s.h?" · "+s.h:""),text:(s.h?s.h+"\n":"")+s.body})});

    const src=S.src.get(one.id);if(src?.text)srcChunks(src.text).forEach((c,n)=>out.push({deckId:one.id,tab:"source",anchor:"src-"+n,label:one.name+" · cours source"+(c.h?" · "+c.h:""),text:(c.h?c.h+"\n":"")+c.t}));
    let tot=0;return out.filter(p=>(tot+=p.text.length)<90000);
  }
  const f={mat:X.chat.mat||"",deck:"",type:""};const {res}=search(q,f);const seen=new Set();

/* ---------- Syndromes et triades : relevés automatiquement dans les cours de chaque matière ---------- */
const SY_RE=/\b(syndromes?|triades?|t[ée]trades?|pentades?)\b(\s+(?:de\s+la\s+|de\s+l['’]\s*|de\s+|d['’]\s*|du\s+|des\s+))?\s*([A-Za-zÀ-ÿœŒ][^,.;:()\n\[\]=*|>?→+«»"0-9·–—/]{0,48})?/gi;
const SY_CUT=new Set("et ou avec chez dans est sont par en à au aux qui que sans traduit associe associé associée associant comprenant comprend caractérisé caractérisée lors pour se sur entre puis selon ainsi dont lorsque quand mais car peut peuvent suivants suivantes suivant suivante".split(" "));
const SY_STOP=new Set("de la le les l d du des un une".split(" "));
function syName(m){
  const kw=m[1].toLowerCase().replace(/s$/,"").replace(/^tetrade$/,"tétrade");
  let rest=(m[3]||"").trim().split(/\s+/);const keep=[];
  for(const w of rest){const f=fold(w);if(SY_CUT.has(f)||SY_CUT.has(w.toLowerCase()))break;keep.push(w);if(keep.length>=4)break}
  while(keep.length&&SY_STOP.has(fold(keep[keep.length-1])))keep.pop();
  const prep=(m[2]||"").trim().replace(/\s+/g," ").replace(/’/g,"'");
  const kwd=m[1].toLowerCase().replace(/^tetrade/,"tétrade");const name=(kwd+(keep.length?(prep?" "+prep+(prep.endsWith("'")?"":" "):" ")+keep.join(" "):"")).replace(/\s+'/,"'").replace(/' /,"'").trim();
  const sig=keep.map(fold).find(w=>w.length>2&&!SY_STOP.has(w));
  return {kw,name,key:kw+"|"+(sig||"")};
}
let SYC=null;
function syndromes(mat){
  const ck=mat+"|"+S.decks.length+"|"+S.decks.reduce((n,d)=>n+(d.fiche||"").length+(d.cards||[]).length,0);
  if(SYC&&SYC.ck===ck)return SYC.v;
  const map=new Map();
  const add=(m,ctx)=>{const s=syName(m);if(!s.key.split("|")[1])return;let e=map.get(s.key);if(!e){e={key:s.key,kw:s.kw,names:new Map(),ctx:[],decks:new Set(),cards:new Set()};map.set(s.key,e)}
    e.names.set(s.name,(e.names.get(s.name)||0)+1);e.decks.add(ctx.deckId);if(ctx.cardId)e.cards.add(ctx.deckId+"|"+ctx.cardId);
    const k=ctx.deckId+"|"+ctx.text;if(!e.ctx.some(c=>c.k===k))e.ctx.push({...ctx,k})};
  for(const d of S.decks){if(mat&&(d.matiere||"Sans matière")!==mat)continue;
    ficheSections(d.fiche).forEach(sec=>{for(const line of [sec.h||"",...String(sec.body).split("\n")]){if(!line.trim())continue;SY_RE.lastIndex=0;let m;while((m=SY_RE.exec(line)))add(m,{deckId:d.id,tab:"fiche",anchor:sec.k!=null?"fs-"+sec.k:null,where:sec.h||"Fiche",text:line.trim()})}});
    (d.cards||[]).forEach(c=>{const t=c.q+" → "+c.a;SY_RE.lastIndex=0;let m;while((m=SY_RE.exec(t)))add(m,{deckId:d.id,tab:"cards",anchor:"card-"+c.id,where:"Flashcard",text:t,cardId:c.id})});
  }
  const v=[...map.values()].map(e=>{const names=[...e.names.entries()].sort((a,b)=>b[1]-a[1]||a[0].length-b[0].length);return {...e,name:names[0][0],alias:names.slice(1,4).map(x=>x[0])}})
    .filter(e=>!/^(syndrome|triade|tétrade|pentade)$/i.test(e.name)).sort((a,b)=>a.kw.localeCompare(b.kw)||fold(a.name).localeCompare(fold(b.name)));
  SYC={ck,v};return v;
}

      ${e.ctx.length>8?`<p class="help">+ ${e.ctx.length-8} autre(s) mention(s)</p>`:""}</div></details>`).join("")}</div>`:""}).join("")||`<div class="empty">Aucun syndrome ni triade trouvé${q?" pour ce filtre":" dans les cours de cette matière"}.</div>`}
  <p class="help">Relevé automatique : un nom peut apparaître sous deux formes proches, et une notion qui n'est pas écrite « syndrome » ou « triade » dans le cours n'apparaît pas ici.</p>`;

/* découpe pour réciter : par sous-partie (### puis ####), petits morceaux regroupés, longs morceaux coupés en parts égales (8 points max, tableaux entiers) */
function recParts(d){
  const units=[];let h2="",h3="",h4="",cur=null;const cl=t=>t.replace(/[*=_`]/g,"").trim();
  const start=()=>{cur={g:h2,h:h4?(h3?h3+" › ":"")+h4:(h3||h2),lines:[]};units.push(cur)};
  for(const raw of String(d.fiche||"").split("\n")){const l=raw.trimEnd();let m;
    if((m=l.match(/^##\s+(.*)/))){h2=cl(m[1]);h3=h4="";cur=null;continue}
    if((m=l.match(/^###\s+(.*)/))){h3=cl(m[1]);h4="";cur=null;continue}
    if((m=l.match(/^####\s+(.*)/))){h4=cl(m[1]);cur=null;continue}
    if(/^#\s/.test(l)||IMG_RE.test(l)||!l.trim())continue;
    if(!cur)start();cur.lines.push(l)}
  const pts=ls=>ls.reduce((n,l)=>n+(/^\|/.test(l)?(/^\|\s*:?-{3}/.test(l)?0:1):/^\s*-/.test(l)?1:0),0);
  const U=units.filter(u=>!/objectif/i.test(u.g)&&pts(u.lines));
  const M=[];U.forEach(u=>{const last=M[M.length-1];
    if(last&&last.g===u.g&&pts(last.lines)<=3&&pts(last.lines)+pts(u.lines)<=8){last.h+=" · "+u.h.replace(/^.* › /,"");last.lines.push(...u.lines);last.parts.push(u.h)}else M.push({...u,lines:[...u.lines],parts:[u.h]})});
  const out=[];
  M.forEach(u=>{const blocks=[];let tb=null;u.lines.forEach(l=>{if(/^\|/.test(l)){if(!tb){tb=[];blocks.push(tb)}tb.push(l)}else{tb=null;blocks.push([l])}});
    const n=pts(u.lines),k=Math.max(1,Math.ceil(n/8)),cap=Math.ceil(n/k);
    const pieces=[];let p=[],c=0;blocks.forEach(b=>{const sz=pts(b);if(c&&c+sz>cap&&pieces.length<k-1){pieces.push(p);p=[];c=0}p.push(...b);c+=sz});if(p.length)pieces.push(p);
    pieces.forEach((ls,i)=>out.push({g:u.g,h:u.h+(pieces.length>1?` (${i+1}/${pieces.length})`:""),hh:u.parts.join(" · "),lines:ls}))});
  return out}

  const ta0=document.getElementById("rc-text");let base=(ta0?.value||"").trim();if(base)base+=" ";
  r.onresult=e=>{let fin="",tmp="";for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t+" ";else tmp+=t}
    base+=fin;const ta=document.getElementById("rc-text");if(ta){ta.value=base+tmp;(X.rcDraft??={})[ta.dataset.rcd]=ta.value}};

/* ---------- Calendrier universitaire : partiels, périodes de révision, vacances, jours fériés ---------- */
const CAL_K={exam:["📝","Examens"],revision:["📚","Révisions"],vacances:["🌴","Vacances"],ferie:["🎉","Férié"],event:["📌","Événement"]};
const calList=()=>((X.planning||{}).calendar||[]).slice().sort((a,b)=>a.from.localeCompare(b.from));
const calOn=date=>calList().filter(c=>c.from<=date&&(c.to||c.from)>=date);
const noClass=date=>calOn(date).some(c=>c.kind==="ferie"||c.kind==="vacances"||c.kind==="exam");
const daysTo=(a,b)=>Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);
function nextExam(date){return calList().find(c=>c.kind==="exam"&&(c.to||c.from)>=date&&!/délib|rattrapage/i.test(c.title))}
function calExams(date){ /* chaque examen du calendrier = un partiel pour toutes les matières du semestre en cours */
  const mats=[...new Set(perDecks().map(d=>d.matiere).filter(Boolean))];
  return calList().filter(c=>c.kind==="exam"&&!/délib/i.test(c.title)&&c.from>=date&&c.from<=addDays(date,21)).flatMap(c=>mats.map(m=>({matiere:m,date:c.from,cal:c.title})))}

function calHome(date){const ex=nextExam(date);const soon=calList().filter(c=>c.kind!=="exam"&&c.from>date&&daysTo(date,c.from)<=14).slice(0,2);
  if(!ex&&!soon.length)return "";

    ${calOn(date).filter(c=>c.kind!=="exam").map(c=>`<div class="help">${CAL_K[c.kind][0]} Aujourd'hui : ${esc(c.title)}</div>`).join("")}
    ${soon.map(c=>`<div class="help">${CAL_K[c.kind][0]} ${esc(c.title)} · ${esc(fmtDate(c.from))} (dans ${daysTo(date,c.from)} j)</div>`).join("")}</div>`}
function calRules(){const L=calList(),t=today();
  return `<div class="section"><h2>Calendrier universitaire</h2>${L.length?L.map(c=>`<div class="mini ${(c.to||c.from)<t?"past":""}"><span>${CAL_K[c.kind][0]} <strong>${esc(c.title)}</strong> <span class="muted">· ${esc(fmtDate(c.from))}${c.to&&c.to!==c.from?" → "+esc(fmtDate(c.to)):""}</span></span><button class="btn ghost small" data-act="pldel" data-l="calendar" data-id="${c.id}">Retirer</button></div>`).join(""):`<p class="help">Aucun calendrier enregistré.</p>`}
  <p class="help">Les jours fériés, les vacances et les semaines d'examens n'ont pas de cours. À l'approche des examens (3 semaines avant), le planning donne la priorité aux chapitres les moins maîtrisés de chaque matière.</p></div>`}

/* ---------- Avancement des cours : ce qui a été fait en classe, matière par matière ---------- */
const isAlt=d=>/^[a-z]+\d+b-/.test(d.id)||/\b20(2[0-5])\b/.test(d.name||"")&&!/2026/.test(d.name||"");
function chapState(d){
  const cls=X.classes.filter(c=>c.deckId===d.id).sort((a,b)=>a.date.localeCompare(b.date));
  if(!cls.length)return {st:"todo",cls};
  const partial=/⏳/.test(String(d.fiche||""));
  return {st:partial?"part":"done",cls,last:cls[cls.length-1],first:cls[0]}}
function matAvance(m,list){
  const ch=list.filter(d=>!d.example&&!isAlt(d)).map(d=>({d,...chapState(d)}));
  const seen=ch.filter(x=>x.st!=="todo"),done=ch.filter(x=>x.st==="done").length,part=ch.filter(x=>x.st==="part").length;
  const rev=seen.filter(x=>x.d.learnedOn).length;
  return {m,ch,seen,done,part,rev,n:ch.length,last:seen.map(x=>x.last).sort((a,b)=>b.date.localeCompare(a.date))[0]}}
function viewAvance(){
  const G=groupsByMat(),A=Object.entries(G).map(([m,l])=>matAvance(m,l)).sort((a,b)=>(b.seen.length>0)-(a.seen.length>0)||(b.last?.date||"").localeCompare(a.last?.date||"")||a.m.localeCompare(b.m));
  const tot=A.reduce((n,a)=>n+a.n,0),seen=A.reduce((n,a)=>n+a.seen.length,0),rev=A.reduce((n,a)=>n+a.rev,0);
  const only=X.avOnly!==false;
  return topbar("Avancement",true)+`<div class="hero"><div class="label">${esc(curPer())}${semWeek(today())?" · semaine "+semWeek(today()):""}</div><h1>Avancement des cours</h1>
    <div class="stats"><div class="stat"><b>${seen}</b><span>chapitres vus en cours</span></div><div class="stat"><b>${rev}</b><span>déjà révisés (J0)</span></div><div class="stat"><b>${A.filter(a=>a.seen.length).length}</b><span>matières commencées</span></div></div></div>
  <div class="chips" style="margin-bottom:12px"><button class="chip" data-act="avonly" data-v="1" aria-pressed="${only}">Matières commencées</button><button class="chip" data-act="avonly" data-v="0" aria-pressed="${!only}">Toutes (${A.length})</button></div>
  <p class="help">Un chapitre est « vu » dès que tu l'enregistres dans <strong>En classe</strong>. ⏳ = commencé, la suite au prochain cours. Les chapitres à venir viennent des anciens supports : la liste peut changer avec les nouveaux cours.</p>
  ${A.filter(a=>!only||a.seen.length).map(a=>{const pct=a.n?Math.round(a.seen.length/a.n*100):0;
    return `<details class="panel avm" ${a.seen.length?"open":""}><summary><div class="row" style="justify-content:space-between;flex-wrap:nowrap;gap:10px"><span><strong>${esc(a.m)}</strong><br><span class="muted">${a.seen.length} / ${a.n} chapitres vus${a.part?` · ${a.part} en cours`:""}${a.last?` · dernier cours ${esc(fmtDate(a.last.date))}`:""}</span></span><span class="pill ${a.seen.length?"ok":""}">${pct}%</span></div><div class="progress"><i style="width:${pct}%"></i></div></summary>
      ${(()=>{const row=x=>{const d=x.d,ji=d.learnedOn?jInfo(d):null;
        const ic=x.st==="done"?"✅":x.st==="part"?"⏳":"⬜";
        const where=x.st==="todo"?"":x.cls.map(c=>`${esc(fmtDate(c.date).replace(/^\S+\s/,""))}${c.titre&&c.titre!==d.name?" · "+esc(c.titre):""}`).join(" · ");
        const rv=x.st==="todo"?"":d.learnedOn?(ji&&ji.finished?`<span class="pill ok">cycle J fini</span>`:`<span class="pill">${(d.jDone||[]).length?"J"+Math.max(...d.jDone)+" fait":"J0 fait"}${ji&&ji.next?` · J${ji.next} ${esc(fmtDate(ji.date).replace(/^\S+\s/,""))}`:""}</span>`):`<span class="pill late">à réviser</span>`;
        return `<button class="avc ${x.st}" data-act="open" data-id="${d.id}"><span class="avi">${ic}</span><span class="avt"><strong>${esc(d.name)}</strong>${where?`<br><span class="muted">${where}</span>`:""}</span>${rv}</button>`};
        const seen=a.ch.filter(x=>x.st!=="todo"),todo=a.ch.filter(x=>x.st==="todo");
        return `${seen.length?`<div class="avl">${seen.map(row).join("")}</div>`:""}${todo.length?`<details class="avtodo"><summary>⬜ À venir · ${todo.length} chapitre${todo.length>1?"s":""}</summary><div class="avl">${todo.map(row).join("")}</div></details>`:""}`})()}
      <button class="btn soft small" data-act="nav" data-v="classe" style="margin-top:8px">+ Noter un nouveau cours</button></details>`}).join("")||`<div class="empty">Aucun cours enregistré pour l'instant. Note tes cours dans « En classe ».</div>`}`}
function avHome(){const A=Object.entries(groupsByMat()).map(([m,l])=>matAvance(m,l)).filter(a=>a.seen.length);if(!A.length)return "";
