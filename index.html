    case "endsession":break;
    /* En classe */
    case "cnew":X.form={id:uid(),date:today(),type:"CM",matiere:"",deckId:"",newName:"",notes:"",comp:null,supports:[],merge:true};X.imp=null;S.view="classe";render();window.scrollTo(0,0);if(b.dataset.imp)setTimeout(()=>$("#cf-files")?.click(),50);break;
    case "cedit":{const x=X.classes.find(y=>y.id===b.dataset.id);if(x){X.form={...clone(x),newName:"",merge:false};X.imp=null;render();window.scrollTo(0,0)}break}
    case "ccancel":X.form=null;X.imp=null;render();window.scrollTo(0,0);break;
    case "csave":saveClasse();break;
    case "cdel":confirmSheet("Supprimer ce cours suivi ?","Supprimer",async()=>{const id=X.form.id;X.classes=X.classes.filter(x=>x.id!==id);await delDoc("classes/"+id);X.form=null;render()});break;
    case "ccomp":readClasseForm();X.form.comp=+b.dataset.n;render();break;
    case "cusesim":readClasseForm();X.form.deckId=b.dataset.id;X.form.newName="";cfDeckRefresh("use");break;
    case "csupdel":readClasseForm();X.form.supports.splice(+b.dataset.i,1);render();break;
    case "cfmat":X.cf.mat=b.dataset.m;render();break;
    case "cfst":X.cf.st=b.dataset.s;render();break;
    case "impfig":{readClasseForm();const all=X.imp.files.flatMap(f=>f.pages.filter(p=>p.thumb));const p=all[+b.dataset.i];if(p){p.fig=!p.fig;const el=document.getElementById("imp-box");if(el){el.innerHTML=impInner();const det=el.querySelector("details");if(det)det.open=true}}break}
    case "cgen":{readClasseForm();const f=X.form;const dk=ensureDeck(f);if(!dk){toast("Choisis un chapitre ou donne un titre au nouveau cours");break}
      const text=(X.imp?.text||"").trim();if(words(text)<30){toast("Texte trop court pour créer une fiche");break}
      const go=()=>genChapter(dk,text,impFigList());
      if((dk.fiche||"").trim())confirmSheet2(`« ${dk.name} » a déjà une fiche. La remplacer par une nouvelle fiche faite depuis ce support ? (L'ancienne est gardée en copie ; les flashcards et QCM existants et leur progression sont conservés, les nouveaux s'ajoutent sans doublon.)`,"Oui, générer",go);else go();
      break}
    case "csrc":{readClasseForm();const dk=ensureDeck(X.form);if(!dk){toast("Choisis un chapitre");break}const prev=S.src.get(dk.id)?.text||"";const t=(X.imp?.text||"").trim();if(prev.includes(t.slice(0,300))){toast("Ce texte est déjà dans le cours source");break}
      await saveSource(dk.id,prev?prev+"\n\n"+t:t);toast("Cours source enregistré");render();break}
    case "cprof":{readClasseForm();const dk=ensureDeck(X.form);if(!dk){toast("Choisis un chapitre");break}const m=mergeNotes(dk.profNotes,X.imp?.text||"");dk.profNotes=m.text;markDirty(dk.id);toast(`${m.added} ligne(s) ajoutée(s) · ${m.skipped} doublon(s) ignoré(s)`);break}
    case "jobstop":X.job?.ctl.abort();break;
    case "jobclose":X.job=null;jobRender();break;
    /* Comprendre / mémoriser */
    case "explain":if(d)doExplain(d);break;
    case "askq":{const el=$("#askq");if(d&&el){const q=el.value;el.value="";doAsk(d,q)}break}
    case "mnemo":{const dk=getDeck(b.dataset.d),c=dk?.cards.find(x=>x.id===b.dataset.c);if(c)doMnemo(dk,c);break}
    case "mnemof":if(d)doMnemoFiche(d,!!b.dataset.re);break;
    case "qdetail":{const dk=getDeck(b.dataset.d),q=dk?.qcm.find(x=>x.id===b.dataset.q);if(q)doQDetail(dk,q);break}
    case "target":{const dk=getDeck(b.dataset.id);if(dk)doTargeted(dk);break}
    /* Révisions ciblées */
    case "rvmat":X.rv.mat=b.dataset.m;render();break;
    case "xsstart":{const items=xsBuild(b.dataset.k);if(!items.length){toast("Rien à réviser ici");break}X.xs={kind:b.dataset.k,items,i:0,ok:0,flipped:false,sel:[],checked:false,first:new Set()};render();window.scrollTo(0,0);break}
    case "xsflip":X.xs.flipped=!X.xs.flipped;render();break;
    case "xsgrade":{const s=X.xs,it=s.items[s.i],{d:dk,c}=xsItem(it);const good=b.dataset.g==="1";const first=!s.first.has(it.id);s.first.add(it.id);gradeCard(dk,c,good,first);if(good){if(first)s.ok++}else s.items.push(it);s.i++;s.flipped=false;render();break}
    case "xspick":{const s=X.xs,k=+b.dataset.k;s.sel=s.sel.includes(k)?s.sel.filter(x=>x!==k):[...s.sel,k];render();break}
    case "xscheck":{const s=X.xs,{d:dk,q}=xsItem(s.items[s.i]);s.lastOk=[...s.sel].sort().join()===[...q.correct].sort().join();if(s.lastOk)s.ok++;gradeQcm(dk,q,s.lastOk);s.checked=true;render();break}
    case "xsnext":{const s=X.xs;s.i++;s.sel=[];s.checked=false;render();break}
    case "xsend":{const s=X.xs;if(s&&s.kind==="err"&&s.i>=s.items.length)markTaskDone(today(),"err",true);X.xs=null;render();break}
    /* Chrono */
    case "chpick":{if(X.chrono&&X.chrono.deckId!==b.dataset.id&&chronoActive(X.chrono)>60000){toast("Termine d'abord la séance en cours");S.view="timer";render();break}
      if(!X.chrono||X.chrono.deckId!==b.dataset.id)chronoStart(b.dataset.id,{rev:!!b.dataset.rev,blockKey:b.dataset.key||null,date:b.dataset.date||today()});else{S.view="timer";render()}break}
    case "chgo":chronoToggle();break;
    case "chend":chronoEnd();break;
    case "chcancel":confirmSheet("Annuler cette séance sans l'enregistrer ?","Annuler la séance",()=>{X.chrono=null;chronoSave();render()});break;
    case "chstep":{const c=X.chrono;if(c){c.steps[b.dataset.k]=b.checked;chronoSave();render()}break}
    /* Syndromes et triades */
    case "synopen":S.mat=b.dataset.m||"";X.ai.syq="";S.view="synd";render();window.scrollTo(0,0);break;
    case "synai":synTable();break;
    case "synquiz":{const ids=new Set(syndromes(S.mat||"").flatMap(x=>[...x.cards]));const items=[...ids].map(k=>{const [deckId,id]=k.split("|");return {deckId,kind:"card",id}}).sort(()=>Math.random()-.5);if(!items.length)break;X.xs={kind:"synd",items,i:0,ok:0,flipped:false,sel:[],checked:false,first:new Set()};S.view="revise";render();window.scrollTo(0,0);break}
    /* Assistant */
    case "assugg":askAssist(b.dataset.q);break;
    case "asgo":{const el=$("#as-in");if(el){const q=el.value;el.value="";askAssist(q)}break}
    case "asclear":X.chat.turns=[];chatSave();render();break;
    case "aiprov":try{localStorage.setItem("revision-ai-provider",b.dataset.p)}catch(err){}render();break;
    case "aikey":{const pv=b.dataset.p||"gemini";const k=($("#ai-key")?.value||"").replace(/[\s\u200b-\u200d\ufeff"'«»]/g,"");if(k.length<20){toast("Clé trop courte : copie la clé complète, pas seulement « …sk8A »");break}
      if(pv==="gemini"&&!/^AIza[0-9A-Za-z_-]{30,}$/.test(k)){toast("Attention : une clé Gemini commence par « AIza » et fait 39 caractères. Vérifie que tu as copié la clé entière.")}
      if(pv==="claude"&&!/^sk-ant-/.test(k)){toast("Attention : une clé Claude commence par « sk-ant- ».")}try{localStorage.setItem(pv==="claude"?"revision-claude-key":"revision-ai-key",k);localStorage.setItem("revision-ai-provider",pv)}catch(err){toast("Impossible d'enregistrer la clé dans ce navigateur");break}toast("Clé enregistrée : l'IA s'active…");setTimeout(()=>location.reload(),600);break}
    case "aikeydel":try{localStorage.removeItem(b.dataset.p==="claude"?"revision-claude-key":"revision-ai-key")}catch(err){}toast("Clé supprimée");setTimeout(()=>location.reload(),600);break;
    /* Planning */
    case "pltab":X.plTab=b.dataset.t;render();break;
    case "plday":X.plDate=addDays(X.plDate||today(),+b.dataset.n);render();break;
    case "plweek":X.plDate=addDays(X.plDate||today(),+b.dataset.n);render();break;
    case "plgo":X.plDate=b.dataset.d;X.plTab="jour";render();window.scrollTo(0,0);break;
    case "plregen":{const dt=X.plDate||today();schedule(dt);await savePlan(dt);toast("Journée réorganisée");render();break}
    case "plimprevu":{const el=$("#nl-in");if(el){const n=nowMin();el.value=`Imprévu ${X.plDate===today()||!X.plDate?"aujourd'hui":"le "+X.plDate} de ${hm(Math.ceil(n/30)*30)} à ${hm(Math.ceil(n/30)*30+120)} : `;el.focus()}else toast("Ajoute ton imprévu dans « Dis-moi ce qui change »");break}
    case "nlgo":{const el=$("#nl-in");if(el)nlEdit(el.value);break}
    case "nlundo":{const u=X.nl?.undo;if(u){X.planning=u.P;X.plans=u.plans;await savePlanning();const dt=today();schedule(dt);await savePlan(dt);X.nl={msg:"Changement annulé"};render()}break}
    case "bdone":{const dt=b.dataset.date||X.plDate||today();const p=X.plans[dt];const bl=p?.blocks.find(x=>x.id===b.dataset.id);if(bl){bl.done=!bl.done;await savePlan(dt);render()}break}
    case "pldel":{const P=X.planning,l=b.dataset.l;P[l]=(P[l]||[]).filter(x=>x.id!==b.dataset.id);await savePlanning();render();break}
    case "pladd":{const l=b.dataset.l,v=id=>document.getElementById(id+"-"+l);const P=X.planning;const s=validT(v("if-s").value),en=validT(v("if-e").value),title=v("if-title").value.trim();
      if(!title||!s||!en||toMin(en)<=toMin(s)){toast("Titre, début et fin (après le début) sont nécessaires");break}
      if(l==="edt")(P.edt??=[]).push({id:uid(),title,day:+v("if-day").value,start:s,end:en,type:v("if-type").value.trim(),lieu:v("if-lieu").value.trim()});
      else if(l==="obligations")(P.obligations??=[]).push({id:uid(),title,date:v("if-date").value||null,days:[],start:s,end:en});
      else{const days=[1,2,3,4,5,6,7].filter(i=>document.getElementById(`if-d${i}-${l}`)?.checked);if(!days.length){toast("Choisis au moins un jour");break}(P.habits??=[]).push({id:uid(),title,days,start:s,end:en})}
      await savePlanning();toast("Ajouté");render();break}
    case "exadd":{const m=$("#ex-mat").value,dt=$("#ex-date").value;if(!m||!dt){toast("Choisis la matière et la date");break}(X.planning.exams??=[]).push({id:uid(),matiere:m,date:dt});await savePlanning();render();break}
    case "prio":{(X.planning.priorities??={})[b.dataset.m]=+b.dataset.n;await savePlanning();render();break}
    case "prefsave":{const P=X.planning.prefs,g=id=>document.getElementById(id).value;const s=validT(g("pf-start")),en=validT(g("pf-end"));if(!s||!en||toMin(en)<=toMin(s)){toast("Heures invalides");break}
      Object.assign(P,{dayStart:s,dayEnd:en,maxStudyMin:Math.max(30,+g("pf-max")||240),block:Math.max(20,+g("pf-block")||50),pause:Math.max(0,+g("pf-pause")||0)});await savePlanning();toast("Réglages enregistrés");render();break}
    case "edttext":{const t=$("#edt-text").value;if(t.trim())edtImport([],t);break}
    case "edtrow":{X.edt.rows[+b.dataset.i].keep=b.checked;break}
    case "edtsave":{const rows=(X.edt?.rows||[]).filter(r=>r.keep!==false).map(r=>({id:uid(),...r}));rows.forEach(r=>delete r.keep);
      if(b.dataset.mode==="replace")X.planning.edt=rows;else{const key=r=>[r.day,r.start,normLine(r.title)].join("|");const have=new Set((X.planning.edt||[]).map(key));(X.planning.edt??=[]).push(...rows.filter(r=>!have.has(key(r))))}
      await savePlanning();X.edt=null;toast(`${rows.length} créneau(x) enregistré(s)`);render();break}
  }
});
let syT=null;document.addEventListener("input",e=>{if(e.target.id==="syq"){X.ai.syq=e.target.value;clearTimeout(syT);syT=setTimeout(()=>{const pos=e.target.selectionStart;render();const el=document.getElementById("syq");if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(x){}}},250)}});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="cf-files"&&t.files?.length){readClasseForm();const fs=[...t.files];readFiles(fs,"cours");render()}
  else if(t.id==="cf-deck"||t.id==="cf-mat"||t.id==="cf-new"){readClasseForm();if(t.id==="cf-mat"&&X.form.deckId&&normLine(getDeck(X.form.deckId)?.matiere||"")!==normLine(X.form.matiere))X.form.deckId="";cfDeckRefresh(t.id==="cf-new"?"new":t.id==="cf-deck"?"deck":"mat")}
  else if(t.id==="ch-mat"){X.ai.chm=t.value;render()}
  else if(t.id==="as-mat"){X.chat.mat=t.value;X.chat.deck="";chatSave();render()}
  else if(t.id==="as-deck"){X.chat.deck=t.value;chatSave();render()}
  else if(t.id==="edt-file"&&t.files?.length)edtImport([...t.files],"");
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="as-in"){e.preventDefault();const q=e.target.value;e.target.value="";askAssist(q)}else if(e.key==="Enter"&&e.target.id==="nl-in"){e.preventDefault();nlEdit(e.target.value)}else if(e.key==="Enter"&&e.target.id==="askq"){e.preventDefault();const d=getDeck(S.deckId);const q=e.target.value;e.target.value="";if(d)doAsk(d,q)}});
setInterval(()=>{if(S.view==="timer"&&X.chrono?.running)tickChrono()},1000);
function renderFab(){let f=document.getElementById("fab");if(!f){f=document.createElement("div");f.id="fab";document.body.appendChild(f)}
  const hide=S.view==="assist"||S.session||X.xs||(S.view==="classe"&&X.form)||(S.view==="deck"&&S.tab==="edit");
  f.innerHTML=hide?"":`<button class="fab" data-act="nav" data-v="assist" aria-label="Demander à l'assistant">✦ Demander</button>`}

renderTabbar();
boot().then(bootExtras);
</script>
